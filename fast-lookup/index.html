<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fast lookup</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #1c1c1e; color: #eee;
        font-family: "PingFang TC", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
      }
      .wrap { max-width: 820px; margin: 0 auto; padding: 24px 18px 60px; }
      a.back { color: #7c828a; text-decoration: none; font-size: 13px; }
      h1 { font-size: 22px; font-weight: 800; margin-top: 6px; }
      p.sub { color: #999; font-size: 14px; margin-top: 4px; }
      .stale-note { color: #d1a54a; font-size: 12px; margin-top: 6px; }

      input[type="search"] {
        width: 100%; margin-top: 14px; background: #232326; color: #eee;
        border: 1px solid #3a3a40; border-radius: 12px; padding: 13px 16px; font-size: 17px; font-family: inherit;
      }
      input[type="search"]:focus { outline: none; border-color: #60a5fa; }

      section { margin-top: 26px; }
      .sec-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; margin: 0 4px 10px; color: #cbd0d6; }
      .sec-title.q { color: #7dd3fc; }
      .rows { display: flex; flex-direction: column; gap: 6px; }
      .row { display: flex; align-items: center; gap: 12px; background: #232326; border: 1px solid #2e2e33; border-radius: 10px; padding: 9px 12px; }
      .row .t { font-size: 22px; font-weight: 600; flex: 0 0 auto; min-width: 2.6em; }
      .row .py { color: #93b3f0; font-size: 14px; flex: 0 0 auto; min-width: 6em; }
      .row .m { color: #a7adb5; font-size: 13px; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; flex: 0 0 auto; }
      .b-active { color: #7ee2a5; background: #14361f; }
      .b-queued { color: #7dd3fc; background: #123047; }
      button { background: #1d4ed8; color: #fff; border: 1px solid #1d4ed8; border-radius: 9px; padding: 6px 13px; font-size: 13px; cursor: pointer; flex: 0 0 auto; }
      button:hover { background: #2563eb; }
      .x { color: #6b7280; cursor: pointer; padding: 0 4px; flex: 0 0 auto; }
      .x:hover { color: #f8a3a3; }
      .empty { color: #666; font-size: 13px; padding: 4px 6px; }
      .hint { color: #7c828a; font-size: 13px; margin-top: 8px; }
      code { background: #232326; border: 1px solid #2e2e33; border-radius: 6px; padding: 1px 6px; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="back" href="/">← Tools</a>
      <h1>🔎 Fast lookup</h1>
      <p class="sub">Search your deck, tap to enable suspended words. The list below clears once you sync.</p>
      <p class="stale-note" id="stale" hidden></p>

      <input id="q" type="search" placeholder="搜尋 · type hanzi, pinyin, or meaning…" autocomplete="off" />

      <section>
        <div class="sec-title">Results · <span id="c-res">0</span></div>
        <div class="rows" id="results"></div>
      </section>

      <section>
        <div class="sec-title q">Selected to enable · <span id="c-q">0</span></div>
        <div class="rows" id="queue"></div>
        <p class="hint">Run <code>./sync_anki_upstash.py --url https://&lt;your-app&gt;.vercel.app</code> — this list empties as they're enabled in Anki.</p>
      </section>
    </div>

    <script>
      const stale = document.getElementById("stale");
      const qInput = document.getElementById("q");

      let mirror = {}, words = [];
      let wants = {};   // word -> "unsuspend"|"suspend"
      const noTone = (s) => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

      async function loadMirror() {
        try {
          const d = await fetch("/api/cards", { cache: "no-store" }).then((r) => r.json());
          mirror = d.cards || {}; words = Object.keys(mirror);
          if (!words.length) { stale.hidden = false; stale.textContent = "⚠ Anki mirror not synced yet — run sync_anki_upstash.py."; }
          else if (d.generated) {
            const h = (Date.now() - new Date(d.generated).getTime()) / 3.6e6;
            stale.hidden = h <= 24;
            if (h > 24) stale.textContent = "⚠ Mirror is " + Math.round(h / 24) + " day(s) old — re-sync for accurate status.";
          }
        } catch (e) {}
      }
      async function loadWants() {
        try { wants = (await fetch("/api/want", { cache: "no-store" }).then((r) => r.json())).wants || {}; } catch (e) {}
      }
      const isQueued = (w) => wants[w] === "unsuspend";

      function row(w, tail) {
        const m = mirror[w] || {};
        const r = document.createElement("div"); r.className = "row";
        const t = document.createElement("span"); t.className = "t"; t.textContent = w; r.appendChild(t);
        const py = document.createElement("span"); py.className = "py"; py.textContent = m.py || ""; r.appendChild(py);
        const me = document.createElement("span"); me.className = "m"; me.textContent = m.m || ""; r.appendChild(me);
        tail(r, w, m); return r;
      }

      function renderResults() {
        const q = qInput.value.trim();
        const box = document.getElementById("results"); box.innerHTML = "";
        if (!q) { box.innerHTML = '<span class="empty">Type to search your deck.</span>'; document.getElementById("c-res").textContent = 0; return; }
        const qn = noTone(q);
        const hits = words.filter((w) => w.includes(q) || noTone(mirror[w].py).includes(qn) || (mirror[w].m || "").toLowerCase().includes(qn)).slice(0, 60);
        hits.forEach((w) => box.appendChild(row(w, (r) => {
          if (isQueued(w)) { const b = document.createElement("span"); b.className = "badge b-queued"; b.textContent = "queued"; r.appendChild(b); return; }
          if (!mirror[w].s) { const b = document.createElement("span"); b.className = "badge b-active"; b.textContent = "✓ active"; r.appendChild(b); return; }
          const btn = document.createElement("button"); btn.textContent = "Enable"; btn.addEventListener("click", () => enable(w)); r.appendChild(btn);
        })));
        if (!hits.length) box.innerHTML = '<span class="empty">No matches in the deck.</span>';
        document.getElementById("c-res").textContent = hits.length;
      }

      function renderQueue() {
        const box = document.getElementById("queue"); box.innerHTML = "";
        const list = Object.keys(wants).filter(isQueued).sort();
        list.forEach((w) => box.appendChild(row(w, (r) => {
          const b = document.createElement("span"); b.className = "badge b-queued"; b.textContent = "waiting"; r.appendChild(b);
          const x = document.createElement("span"); x.className = "x"; x.textContent = "✕"; x.title = "Remove"; x.addEventListener("click", () => unqueue(w)); r.appendChild(x);
        })));
        if (!list.length) box.innerHTML = '<span class="empty">Empty — nothing waiting to be enabled.</span>';
        document.getElementById("c-q").textContent = list.length;
      }

      async function enable(w) {
        wants[w] = "unsuspend"; renderResults(); renderQueue();
        await fetch("/api/want", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ word: w, action: "unsuspend" }) });
        ensurePoll();
      }
      async function unqueue(w) {
        delete wants[w]; renderQueue(); renderResults();
        await fetch("/api/want", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ clear: [w] }) });
      }

      let poll = null;
      function ensurePoll() {
        if (poll) return;
        poll = setInterval(async () => {
          const before = Object.keys(wants).filter(isQueued).length;
          await loadWants();
          const after = Object.keys(wants).filter(isQueued).length;
          if (after !== before) await loadMirror(); // sync ran — refresh statuses
          renderQueue(); renderResults();
          if (!after && poll) { clearInterval(poll); poll = null; }
        }, 5000);
      }

      qInput.addEventListener("input", renderResults);
      (async function init() { await loadMirror(); await loadWants(); renderResults(); renderQueue(); if (Object.keys(wants).filter(isQueued).length) ensurePoll(); qInput.focus(); })();
    </script>
  </body>
</html>
