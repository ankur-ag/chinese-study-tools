<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chinese Study Tools</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #1c1c1e;
        color: #eee;
        font-family: "PingFang TC", "Noto Sans TC", -apple-system,
          BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
        min-height: 100vh;
      }
      .wrap { max-width: 760px; margin: 0 auto; padding: 48px 20px 60px; }
      header h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.01em; }
      header p { color: #999; font-size: 16px; margin-top: 8px; }

      .tools { margin-top: 32px; display: grid; gap: 14px; }
      a.tool {
        display: block;
        text-decoration: none;
        color: inherit;
        background: #232326;
        border: 1px solid #2e2e33;
        border-radius: 14px;
        padding: 18px 20px;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      a.tool:hover { background: #2a2a2f; border-color: #3a3a42; }
      .tool .emoji { font-size: 24px; }
      .tool h2 { font-size: 18px; font-weight: 700; margin-top: 6px; }
      .tool p { color: #9aa0a6; font-size: 14px; margin-top: 4px; }
      .tool.soon { opacity: 0.5; }
      .badge {
        float: right;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #7c828a;
        border: 1px solid #3a3a42;
        border-radius: 999px;
        padding: 2px 9px;
        margin-top: 4px;
      }
      footer { margin-top: 40px; color: #666; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Chinese Study Tools</h1>
        <p>A small toolbox my teachers and I use to keep my studying on track.</p>
      </header>

      <div class="tools">
        <a class="tool" href="/word-review/">
          <div class="emoji">🗳️</div>
          <h2>Word review</h2>
          <p>Teachers 👍/👎 the words about to enter my rotation, so I don't
            waste time on ones that aren't useful.</p>
        </a>

        <!-- Add more tools here as they're built. -->
      </div>

      <footer>Built with Anki + a few gists. More tools coming.</footer>
    </div>
  </body>
</html>
