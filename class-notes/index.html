<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>中文複習 · My Mandarin Review</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F4EF;--card:#FBFCFA;--ink:#1E2A27;--muted:#69746E;
    --jade:#1E7A5E;--jade-deep:#155843;--jade-tint:#E4EEE7;
    --amber:#BE863A;--rule:#D7DDD4;
    --shadow:0 1px 2px rgba(30,42,39,.04),0 8px 24px rgba(30,42,39,.05);
    --tc:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    --tc-serif:"Noto Serif TC","PingFang TC",serif;
    --display:"Spectral",Georgia,serif;--ui:"Inter",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--ui);line-height:1.5;padding-bottom:4rem}
  .wrap{max-width:840px;margin:0 auto;padding:0 1.1rem}
  .back{display:inline-block;font-family:var(--ui);font-size:.82rem;color:var(--jade);text-decoration:none;font-weight:500;margin-bottom:1rem}
  .back:hover{color:var(--jade-deep)}
  header{padding:2.3rem 0 1rem}
  .eyebrow{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--jade);font-weight:600}
  h1{font-family:var(--tc-serif);font-weight:700;font-size:2.4rem;line-height:1.05;margin:.35rem 0 .15rem}
  h1 .lat{font-family:var(--display);font-weight:600;font-size:1.25rem;display:block;color:var(--muted);margin-top:.25rem}
  .meta{color:var(--muted);font-size:.9rem;margin-top:.5rem;max-width:64ch}
  .bar{position:sticky;top:0;z-index:20;background:rgba(241,244,239,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);padding:.6rem 0;margin:1.2rem 0 1.4rem}
  .bar-inner{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
  .tabs{display:flex;gap:.25rem;background:var(--jade-tint);padding:.22rem;border-radius:999px;flex-wrap:wrap}
  .tab{font-family:var(--tc);font-size:.88rem;font-weight:500;color:var(--jade-deep);border:none;background:transparent;padding:.36rem .7rem;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
  .tab .en{font-family:var(--ui);font-size:.68rem;opacity:.7;margin-left:.25rem}
  .tab[aria-selected="true"]{background:var(--jade);color:#fff;box-shadow:var(--shadow)}
  .search{flex:1 1 130px;min-width:110px}
  .search input{width:100%;font-family:var(--tc);font-size:.9rem;color:var(--ink);border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:.4rem .9rem;outline:none;transition:border-color .15s}
  .search input:focus{border-color:var(--jade)}
  .toggle{font-family:var(--ui);font-size:.78rem;font-weight:500;color:var(--muted);border:1px solid var(--rule);background:var(--card);padding:.38rem .65rem;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:.35rem}
  .toggle .dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--rule)}
  .toggle[aria-pressed="true"]{color:var(--jade-deep);border-color:var(--jade);background:var(--jade-tint)}
  .toggle[aria-pressed="true"] .dot{background:var(--jade)}
  .panel{display:none;animation:fade .3s ease both}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .cat,.tier{margin-bottom:1.9rem}
  .cat-head,.tier-head{display:flex;align-items:baseline;gap:.6rem;margin:0 .1rem .7rem;padding-bottom:.4rem;border-bottom:1px solid var(--rule)}
  .tier-head{border-bottom:2px solid var(--jade)}
  .cat-head .zh,.tier-head .zh{font-family:var(--tc-serif);font-weight:700;font-size:1.18rem}
  .cat-head .en{font-family:var(--display);font-style:italic;color:var(--muted);font-size:.95rem}
  .tier-head .n{font-family:var(--display);font-weight:600;font-size:1rem;color:var(--jade);font-style:italic}
  .cat-head .count,.tier-head .count{margin-left:auto;font-family:var(--ui);font-size:.72rem;color:var(--muted);background:var(--jade-tint);padding:.12rem .5rem;border-radius:999px}
  .tier-sub,.cat-sub{font-size:.82rem;color:var(--muted);margin:-.4rem .1rem 1rem}
  .g-card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.65rem;box-shadow:var(--shadow)}
  .g-pattern{font-family:var(--tc);font-size:1.4rem;font-weight:500;line-height:1.4;display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
  .g-pattern b{color:var(--jade);font-weight:700}
  .g-pattern .slot{color:var(--amber);font-style:normal;font-family:var(--display);font-weight:600;font-size:1.15rem}
  .tag{font-family:var(--display);font-size:.72rem;font-weight:600;font-style:italic;color:var(--jade-deep);background:var(--jade-tint);border-radius:6px;padding:.08rem .4rem;flex:0 0 auto;transform:translateY(-1px)}
  .g-gloss,.fn{font-family:var(--ui);font-size:.88rem;color:var(--muted);margin-top:.35rem}
  .g-ex{margin-top:.65rem;padding-top:.65rem;border-top:1px dashed var(--rule);display:flex;flex-direction:column;gap:.32rem}
  .g-ex p{font-family:var(--tc);font-size:1.03rem;color:var(--ink)}
  .g-ex p b{color:var(--jade-deep);font-weight:700;border-bottom:2px solid var(--jade-tint)}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:13px;padding:.9rem 1rem;margin-bottom:.62rem;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:.15rem .85rem;align-items:start}
  .freq{display:flex;gap:.18rem;padding-top:.5rem;grid-row:1/3}
  .freq i{width:.42rem;height:.42rem;border-radius:50%;background:var(--rule)}
  .freq i.on{background:var(--jade)}
  .card-main{grid-column:2}
  .card .g-ex{border-top-color:var(--rule)}
  .v-grid{display:grid;grid-template-columns:1fr;gap:.35rem}
  .legend{display:flex;align-items:center;flex-wrap:wrap;gap:.1rem;font-size:.8rem;color:var(--muted);margin:0 .1rem 1rem}
  .legend .freq{display:inline-flex;margin:0 .25rem;vertical-align:middle}
  .v-row .freq{align-self:center}
  .copybtn{font-family:var(--ui);font-size:.74rem;font-weight:600;color:#fff;background:var(--jade);border:none;border-radius:999px;padding:.28rem .75rem;margin-left:.5rem;cursor:pointer;transition:background .15s,transform .1s}
  .copybtn:active{transform:scale(.96)}
  .copybtn.done{background:var(--jade-deep)}
  .classgroup{margin-bottom:2.3rem}
  .classhead{display:flex;align-items:baseline;gap:.55rem;flex-wrap:wrap;margin:.2rem .1rem 1rem;padding-bottom:.5rem;border-bottom:2px solid var(--jade)}
  .classhead .cdate{font-family:var(--display);font-style:italic;font-weight:600;color:var(--jade);font-size:.95rem}
  .classhead .ctitle{font-family:var(--tc-serif);font-weight:700;font-size:1.35rem}
  .classhead .cen{font-family:var(--ui);font-size:.8rem;color:var(--muted)}
  .classhead .ccount{margin-left:auto;font-size:.72rem;color:#fff;background:var(--jade);padding:.15rem .55rem;border-radius:999px;font-weight:600}
  .classhead .copybtn{margin-left:.4rem;font-size:.68rem;padding:.2rem .6rem}
  .classgroup .cat{margin-bottom:1.1rem}
  .classgroup .cat-head .zh{font-size:1.02rem}
  .classgroup .cat-head .en{font-size:.85rem}
  .v-row{display:flex;align-items:baseline;gap:.7rem;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:.58rem .85rem}
  .v-rank{font-family:var(--display);font-style:italic;color:var(--jade);font-size:.85rem;flex:0 0 auto;width:1.4em;text-align:right}
  .v-zh{font-family:var(--tc);font-size:1.28rem;font-weight:500;flex:0 0 auto;min-width:3.4em}
  .v-py{font-family:var(--display);font-style:italic;color:var(--jade);font-size:.9rem;flex:0 0 auto;min-width:5.4em}
  .v-en{font-family:var(--ui);font-size:.88rem;color:var(--muted);flex:1 1 auto}
  .pair{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.65rem;box-shadow:var(--shadow)}
  .pair-row{display:flex;gap:.8rem;flex-wrap:wrap}
  .pair-side{flex:1 1 40%;min-width:150px}
  .pair-side .v-zh{font-size:1.45rem;display:block}
  .pair-side .v-py{display:block;margin:.15rem 0}
  .pair-side .v-en{display:block}
  .pair-vs{align-self:center;font-family:var(--display);font-style:italic;color:var(--amber);font-size:1rem;font-weight:600}
  .pair-note{font-family:var(--ui);font-size:.82rem;color:var(--jade-deep);margin-top:.65rem;padding-top:.6rem;border-top:1px dashed var(--rule);display:flex;gap:.4rem;align-items:flex-start}
  .pair-note::before{content:"⚠︎";color:var(--amber);flex:0 0 auto}
  body.test .v-en,body.test .g-gloss,body.test .fn,body.test .pair-note{filter:blur(5px);opacity:.35;cursor:pointer;transition:filter .15s,opacity .15s;user-select:none;border-radius:4px}
  body.test .v-en:hover,body.test .g-gloss:hover,body.test .fn:hover,body.test .pair-note:hover,.revealed{filter:none!important;opacity:1!important}
  body.nopy .v-py{filter:blur(5px);opacity:.35;cursor:pointer;transition:filter .15s,opacity .15s;user-select:none;border-radius:4px}
  body.nopy .v-py:hover,.v-py.revealed{filter:none!important;opacity:1!important}
  .empty{text-align:center;color:var(--muted);font-size:.95rem;padding:2.5rem 0;font-family:var(--tc)}
  footer{margin-top:2rem;padding-top:1.2rem;border-top:1px solid var(--rule);color:var(--muted);font-size:.8rem;line-height:1.6}
  footer b{color:var(--ink)}
  @media(max-width:520px){h1{font-size:2rem}.g-pattern{font-size:1.22rem}.tab .en{display:none}.v-py{min-width:4.6em}}
  @media(prefers-reduced-motion:reduce){.panel{animation:none}*{transition:none!important}}
</style>
</head>

let byClass=true;
function sectionHTML(c,core){
  const ws=core?[...c.w].sort((a,b)=>prio(b)-prio(a)):c.w;
  return `<div class="cat">
    <div class="cat-head"><span class="zh">${c.zh}</span><span class="en">${c.en}</span><span class="count">${c.w.length}</span></div>
    ${c.sub?`<p class="cat-sub">${c.sub}</p>`:''}
    <div class="v-grid">${ws.map(vRow).join('')}</div>
  </div>`;
}
function renderVocab(core){
  const legend=`<p class="legend">Dots = how commonly used: ${dots(3)} learn first · ${dots(2)} common · ${dots(1)} situational. <button class="copybtn" id="copyBtn">⧉ Copy all</button></p>`;
  let body;
  if(byClass){
    body=CLASSES.map(cl=>{
      const secs=VOCAB.filter(c=>CLASSMAP[c.zh]===cl.id);
      if(!secs.length)return '';
      const total=secs.reduce((n,c)=>n+c.w.length,0);
      return `<div class="classgroup" data-cls="${cl.id}">
        <div class="classhead"><span class="cdate">${cl.date||'date n/a'}</span><span class="ctitle">${cl.t}</span><span class="cen">${cl.en}</span><span class="ccount">${total}</span><button class="copybtn" data-copycls="${cl.id}">⧉ Copy</button></div>
        ${secs.map(c=>sectionHTML(c,core)).join('')}
      </div>`;
    }).join('');
  } else {
    body=VOCAB.map(c=>sectionHTML(c,core)).join('');
  }
  document.getElementById('vocab').innerHTML=legend+body;
}

const tabs=[...document.querySelectorAll('.tab')];
const panels={vocab:document.getElementById('vocab'),struct:document.getElementById('struct'),pairs:document.getElementById('pairs'),book:document.getElementById('book')};
tabs.forEach(t=>t.addEventListener('click',()=>{
  tabs.forEach(x=>x.setAttribute('aria-selected','false'));t.setAttribute('aria-selected','true');
  Object.values(panels).forEach(p=>p.classList.remove('active'));panels[t.dataset.panel].classList.add('active');
  applySearch();
}));
const testBtn=document.getElementById('testBtn'),pyBtn=document.getElementById('pyBtn');
testBtn.addEventListener('click',()=>{const on=testBtn.getAttribute('aria-pressed')==='true';testBtn.setAttribute('aria-pressed',String(!on));document.body.classList.toggle('test',!on);});
pyBtn.addEventListener('click',()=>{const on=pyBtn.getAttribute('aria-pressed')==='true';pyBtn.setAttribute('aria-pressed',String(!on));document.body.classList.toggle('nopy',!on);});
const coreBtn=document.getElementById('coreBtn'),onlyBtn=document.getElementById('onlyBtn');

const search=document.getElementById('search');
function applySearch(){
  const q=search.value.trim().toLowerCase();
  const active=document.querySelector('.panel.active');
  active.querySelectorAll('.cat,.tier').forEach(sec=>{
    let any=false;
    sec.querySelectorAll('.v-row,.g-card,.pair,.card').forEach(item=>{
      let hit=!q||item.textContent.toLowerCase().includes(q);
      if(hit&&document.body.classList.contains('coreonly')){const p=item.getAttribute('data-p');if(p&&p!=='3')hit=false;}
      item.style.display=hit?'':'none';if(hit)any=true;
    });
    sec.style.display=any?'':'none';
  });
  active.querySelectorAll('.classgroup').forEach(g=>{
    const vis=[...g.querySelectorAll('.cat')].some(c=>c.style.display!=='none');
    g.style.display=vis?'':'none';
  });
  let ph=active.querySelector('.empty');
  const none=![...active.querySelectorAll('.cat,.tier')].some(c=>c.style.display!=='none');
  if(none&&q){if(!ph){ph=document.createElement('p');ph.className='empty';ph.textContent='沒有結果 · no matches';active.appendChild(ph);}ph.style.display='';}
  else if(ph){ph.style.display='none';}
}
search.addEventListener('input',applySearch);
document.addEventListener('click',async e=>{
  const btn=e.target.closest('#copyBtn,[data-copycls]'); if(!btn) return;
  const scope=btn.hasAttribute('data-copycls')?btn.closest('.classgroup'):document.getElementById('vocab');
  const rows=[...scope.querySelectorAll('.v-row')].filter(r=>r.style.display!=='none');
  const text=rows.map(r=>[r.querySelector('.v-zh').textContent,r.querySelector('.v-py').textContent,r.querySelector('.v-en').textContent].join('\t')).join('\n');
  let ok=false;
  try{await navigator.clipboard.writeText(text);ok=true;}catch(_){}
  if(!ok){try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.focus();ta.select();ok=document.execCommand('copy');document.body.removeChild(ta);}catch(_){ok=false;}}
  const orig=btn.textContent;
  btn.textContent=ok?('✓ '+rows.length):'Copy failed';
  btn.classList.add('done');
  setTimeout(()=>{btn.textContent=orig;btn.classList.remove('done');},1600);
});
